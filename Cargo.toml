[package]
name = "ammon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Inference operators, tokenizer, and decode loop on Goldy tensors"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
goldy = { path = "../goldy", default-features = false, features = ["tensor"] }

[features]
default = []
cuda = ["goldy/cuda"]
metal = ["goldy/metal"]

[lib]
name = "ammon"
path = "src/lib.rs"
