[package]
name = "ammon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Inference operators, tokenizer, and decode loop on Goldy tensors"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
goldy = { path = "../goldy", default-features = false, features = ["tensor"] }
memmap2 = "0.9"
safetensors = "0.8.0"
tokenizers = { version = "0.21.4", optional = true, default-features = false, features = ["fancy-regex"] }

[features]
default = []
cuda = ["goldy/cuda"]
metal = ["goldy/metal"]
vulkan = ["goldy/vulkan"]
hf-tokenizer = ["dep:tokenizers"]

[lib]
name = "ammon"
path = "src/lib.rs"
