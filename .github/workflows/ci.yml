# Host tests, then the Vulkan suite on Mesa lavapipe.
#
# Goldy is a path dependency (`../goldy`). The job checks ammon and goldy out
# as siblings. GPU tests are not optional: the job fails if lavapipe is missing
# or does not advertise Vulkan 1.4.
#
# GOLDY_REF is the goldy checkout.
# Indexed GEMV reads the slab in place, and a unit softcap is one tanh
# inside goldy. Retained command buffers keep their own frame-table rows.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [goldy_main]

env:
  GOLDY_REF: main

jobs:
  test:
    name: lavapipe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lavapipe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            pkg-config \
            unzip \
            libvulkan1 \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools
          lvp="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          if [ -z "$lvp" ]; then
            echo "lavapipe ICD not installed; refusing to skip GPU tests"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
          DISPLAY= vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -E 'apiVersion[[:space:]]+= 1\.4\.' /tmp/vulkaninfo.txt
          grep -Ei 'deviceName.*(llvmpipe|lavapipe)' /tmp/vulkaninfo.txt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ammon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ammon/Cargo.lock', 'goldy/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Host tests
        working-directory: ammon
        run: cargo test --lib && cargo check --features hf-tokenizer

      - name: Vulkan tests
        working-directory: ammon
        run: cargo test --features vulkan -- --test-threads=1

  metal:
    name: Metal (${{ matrix.arithmetic }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arithmetic: [match-recorded, relaxed]
    env:
      AMMON_ARITHMETIC_POLICY: ${{ matrix.arithmetic }}
      MTL_DEBUG_LAYER: "1"
      MTL_SHADER_VALIDATION: "1"
    steps:
      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Slang compiler
        working-directory: goldy/slang
        run: |
          set -euo pipefail
          chmod +x download.sh
          ./download.sh
          if [ "$(uname -m)" = "arm64" ]; then
            SLANG_DIR="$(pwd)/bin/macos-aarch64"
          else
            SLANG_DIR="$(pwd)/bin/macos-x86_64"
          fi
          echo "GOLDY_SLANG_PATH=$SLANG_DIR/libslang.dylib" >> "$GITHUB_ENV"
          echo "SLANG_LIB_DIR=$SLANG_DIR" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ammon/target
          key: ${{ runner.os }}-cargo-metal-${{ hashFiles('ammon/Cargo.lock', 'goldy/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-metal-

      - name: Metal tests
        working-directory: ammon
        env:
          DYLD_LIBRARY_PATH: ${{ env.SLANG_LIB_DIR }}
        run: |
          set -euo pipefail
          cargo test --features metal --lib \
            --test fused_blocks \
            --test inkling_attention \
            --test kernels \
            --test moe \
            --test packed \
            --test scratch_lifetime \
            -- --test-threads=1
          # The model path uses position-addressed algebra. Keep the legacy
          # stateful dynamic-convolution cases on lavapipe until Metal can
          # synchronize MPS writes consumed by a generated kernel in one graph.
          cargo test --features metal --test decode_ops -- \
            --test-threads=1 \
            --skip dynamic_short_conv_matches_cpu_reference_and_resets \
            --skip matches_pinned_transformers_modules \
            --skip wide_clip_and_conv_match_reference
