# Host tests, then the Vulkan suite on Mesa lavapipe.
#
# Goldy is a path dependency (`../goldy`). The job checks ammon and goldy out
# as siblings. GPU tests are not optional: the job fails if lavapipe is missing
# or does not advertise Vulkan 1.4.
#
# Bump GOLDY_REF when ammon should build against a newer goldy. Change only
# that value; the checkout step reads it. The pin is goldy main
# (8a79d75, merge of #341, which includes #340). Indexed GEMV reads the
# slab in place, and a unit softcap is one tanh inside goldy.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GOLDY_REF: 8a79d75d9b8969ce941201284e805e3ca170c4de

jobs:
  test:
    name: lavapipe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ammon
        uses: actions/checkout@v4
        with:
          path: ammon

      - name: Checkout goldy
        uses: actions/checkout@v4
        with:
          repository: koubaa/goldy
          ref: ${{ env.GOLDY_REF }}
          path: goldy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lavapipe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            pkg-config \
            unzip \
            libvulkan1 \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools
          lvp="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)"
          if [ -z "$lvp" ]; then
            echo "lavapipe ICD not installed; refusing to skip GPU tests"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
          DISPLAY= vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -E 'apiVersion[[:space:]]+= 1\.4\.' /tmp/vulkaninfo.txt
          grep -Ei 'deviceName.*(llvmpipe|lavapipe)' /tmp/vulkaninfo.txt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ammon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ammon/Cargo.lock', 'goldy/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Host tests
        working-directory: ammon
        run: cargo test --lib && cargo check --features hf-tokenizer

      - name: Vulkan tests
        working-directory: ammon
        run: cargo test --features vulkan -- --test-threads=1
